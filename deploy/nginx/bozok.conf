# /etc/nginx/sites-available/bozok
# Kurulum: bash deploy/setup-domain.sh bozok.senindomain.com

upstream bozok_app {
    server 127.0.0.1:10000;
    keepalive 16;
}

server {
    listen 80;
    server_name BOZOK_DOMAIN;

    client_max_body_size 20M;

    access_log /var/log/nginx/bozok.access.log;
    error_log  /var/log/nginx/bozok.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    location /api/dashboard-ws {
        proxy_pass http://bozok_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        proxy_pass http://bozok_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
