# Production — Hetzner: docker compose -f docker-compose.prod.yml up -d --build
# Önce .env dosyasını .env.production.example'dan kopyalayıp doldurun.

services:
  db:
    image: postgres:16-alpine
    container_name: bozok-db
    restart: always
    environment:
      POSTGRES_DB: bozok_dashboard
      POSTGRES_USER: bozok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}
    volumes:
      - bozok-postgres:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c max_connections=50
      -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bozok -d bozok_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .
    container_name: bozok-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: 10000
      BOZOK_DATA_DIR: /data
      DATABASE_URL: postgres://bozok:${POSTGRES_PASSWORD}@db:5432/bozok_dashboard
      DATABASE_RETRY_DELAY_MS: 3000
      DATABASE_CONNECT_TIMEOUT_MS: 8000
      DATABASE_QUERY_TIMEOUT_MS: 8000
      DATABASE_STATEMENT_TIMEOUT_MS: 15000
      DATABASE_POOL_MAX: 5
      REQUIRE_DATABASE: 1
      DATABASE_REQUIRED: 1
      DATABASE_READ_FALLBACK: 0
      DATABASE_WRITE_FALLBACK: 0
      DASHBOARD_FILE_FALLBACK: 0
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BOZOK_PUBLIC_URL: ${BOZOK_PUBLIC_URL:-}
      RENDER_EXTERNAL_URL: ${BOZOK_PUBLIC_URL:-}
      TELEGRAM_ACCOUNT_LIMIT_AMOUNT: "100000"
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - bozok-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 90s

volumes:
  bozok-postgres:
  bozok-data:
